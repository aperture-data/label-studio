name: Prepare ApertureDB SDK
description: Pull the infra-promoted SDK wheel for the build or Poetry environment
inputs:
  action:
    description: Prepare Poetry or just pull the Docker build input
    default: prepare
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v1
      with:
        version: '1.3.0'
    - name: Add Poetry to the native Windows path
      if: runner.os == 'Windows' && (inputs.action == 'prepare' || inputs.action == 'lock')
      shell: bash
      # snok/install-poetry writes a Git Bash path. Python launches poetry.exe using the Windows PATH.
      run: cygpath -aw "${POETRY_HOME:-$HOME/.local}/bin" >> "$GITHUB_PATH"
    - shell: bash
      env:
        SDK_ACTION: ${{ inputs.action }}
      run: python scripts/aperturedb_sdk.py "$SDK_ACTION"
